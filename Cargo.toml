[package]
name = "flux-wasm-builder"
version = "0.3.1"
edition = "2021"

[[bin]]
name = "flux-wasm-builder"
path = "src/bin/main.rs"

[lib]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["process", "time", "rt", "rt-multi-thread", "macros", "fs", "sync"] }
thiserror = "2.0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
actix-web = "4"
mime_guess = "2"
serde_json = "1"
notify-debouncer-mini = "0.7"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tokio-test = "0.4"
actix-rt = "2"
