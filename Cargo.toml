[package]
name = "wasm-drydock"
version = "0.23.7"
edition = "2024"

[[bin]]
name = "wasm-drydock"
path = "src/bin/main.rs"

[lib]

[dependencies]
actix-web = "4.13"
actix-ws = "0.4.0"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
grass = "0.13.4"
mime_guess = "2"
notify-debouncer-mini = "0.7"
reqwest = "0.13.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tera = "1"
tokio = { version = "1.50", features = ["process", "time", "rt", "rt-multi-thread", "macros", "fs", "sync"] }
toml = "1.0.3"
thiserror = "2.0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webbrowser = "1.1.0"

[dependencies.include_dir]
version = "0.7"
optional = true

[features]
embed-assets = ["dep:include_dir"]

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tokio-test = "0.4"
actix-rt = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["signal"] }

[profile.release]
lto = true         
codegen-units = 1   
strip = true        
panic = "abort"     

[profile.dev]
debug = true        

[profile.dev.package."*"]
opt-level = 2 
